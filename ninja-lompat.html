<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ninja Lompat</title>
<style>
:root{color-scheme:dark;--bg:#120c24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:10px}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(18,12,36,.86);overflow-y:auto}
#ov.h{display:none}
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#ov h1{font:900 46px/1.05 Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;margin:0 0 8px;background:linear-gradient(90deg,#ff7a45,#ffd23f,#ff4d8d);-webkit-background-clip:text;background-clip:text;color:transparent}
#ov p{margin:0 0 14px;max-width:330px;line-height:1.45;font-size:15px;color:#e0d8ff}
#ov .em{font-size:60px;line-height:1;margin-bottom:6px}
#ov button{font:800 18px system-ui,sans-serif;padding:14px 22px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff6a3d,#ffc233);color:#2a1200;width:100%;max-width:320px;margin-bottom:10px;box-shadow:0 5px 0 #a8431c}
#ov button:active{transform:translateY(3px);box-shadow:0 2px 0 #a8431c}
#ov button.s2{background:#2d2552;color:#fff;box-shadow:0 5px 0 #15102c}
.lg{display:flex;gap:12px;justify-content:center;margin:0 0 14px;font-size:12px;color:#e0d8ff}
.lg span{display:flex;flex-direction:column;align-items:center;gap:2px;max-width:76px}.lg b{font-size:24px}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="ov"></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),cx=cv.getContext('2d'),ov=$('ov');
const W=360,H=600,FONT='Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif';
cv.width=W*2;cv.height=H*2;
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const GR=1500,JUMP=-640,SPRING=-930,PW=74;
const TH=[{n:'SENJA',a:'#2a1c5e',b:'#ff7a5a',m:'#3a2457',m2:'#5a2f63',moon:'#fff0b8'},{n:'MALAM',a:'#070a22',b:'#2b2a6b',m:'#141836',m2:'#1f2150',moon:'#e8f0ff'},{n:'FAJAR',a:'#3f6fd8',b:'#ffd6a0',m:'#4b5f9e',m2:'#7a86b8',moon:'#fff6d0'}];
let st='menu',nj,plats,obs,coins,parts,petals,camY,topY,maxH,coinN,level,shield,inv,hold=0,clock=0,last=performance.now(),best=0,shake=0,banner=0,bannerT='',mute=false,AC=null,over=0,nextPick=0,sq=0;
try{best=+localStorage.getItem('ninjabest')||0;mute=localStorage.getItem('ninjamute')==='1'}catch(e){}

/* ---------- SFX ---------- */
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty,v,t0,f2){const a=ac();if(!a)return;const t=a.currentTime+(t0||0),o=a.createOscillator(),q=a.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);q.gain.setValueAtTime(.0001,t);q.gain.exponentialRampToValueAtTime(v||.2,t+.01);q.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(q);q.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,t0,fl){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),q=a.createGain(),t=a.currentTime+(t0||0);s.buffer=b;f.type='bandpass';f.frequency.value=fl||1200;q.gain.setValueAtTime(.0001,t);q.gain.exponentialRampToValueAtTime(v,t+Math.min(.1,d/3));q.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(q);q.connect(a.destination);s.start(t)}
function sfx(k){
  if(mute)return;
  if(k==='click')tone(660,.06,'square',.05);
  else if(k==='jump')tone(320,.13,'sine',.13,0,640);
  else if(k==='spring'){tone(260,.28,'sine',.16,0,1100);tone(520,.2,'triangle',.08,.05,1500)}
  else if(k==='coin'){tone(988,.07,'square',.06);tone(1319,.12,'square',.06,.06)}
  else if(k==='crumble'){noise(.3,.18,0,600);tone(120,.25,'square',.08,0,60)}
  else if(k==='whoosh')noise(.35,.05,0,2200);
  else if(k==='shield'){[523,659,784].forEach((f,i)=>tone(f,.15,'triangle',.12,i*.07))}
  else if(k==='block'){noise(.25,.2,0,1500);tone(300,.2,'square',.1,0,120)}
  else if(k==='hit'){noise(.35,.25,0,700);tone(180,.4,'sawtooth',.15,0,50)}
  else if(k==='fall')tone(500,.7,'sine',.12,0,90);
  else if(k==='lvl')[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.13,i*.09));
}
document.addEventListener('pointerdown',e=>{ac();if(e.target.closest&&e.target.closest('#ov button'))sfx('click')});
const mb=document.createElement('button');
mb.setAttribute('style','position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;background:rgba(18,12,36,.85);color:#fff;border:1px solid #5a4aa0;border-radius:20px;padding:6px 12px;font-size:18px');
mb.setAttribute('aria-label','Suara');mb.textContent=mute?'🔇':'🔊';
mb.onclick=()=>{mute=!mute;mb.textContent=mute?'🔇':'🔊';try{localStorage.setItem('ninjamute',mute?'1':'0')}catch(e){}};
document.body.appendChild(mb);

/* ---------- Layar & menu ---------- */
function fit(){const s=$('stage'),k=Math.min(s.clientWidth/W,s.clientHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px'}
addEventListener('resize',fit);fit();
function show(em,h,p,btns,extra){
  ov.innerHTML='<div class=em>'+em+'</div><h1>'+h+'</h1><p>'+p+'</p>'+(extra||'');
  btns.forEach(([t,fn,c])=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=()=>{ov.classList.add('h');fn()};ov.appendChild(b)});
  ov.classList.remove('h');
}
function menu(){
  st='menu';initWorld();
  show('🥷','NINJA LOMPAT','Ninja melompat otomatis tiap mendarat. Sentuh sisi <b>kiri</b> atau <b>kanan</b> layar untuk bergeser, dan naik setinggi mungkin! Rekor: '+best+' m.',[['Mulai Melompat',start]],
   '<div class=lg><span><b>🪵</b>platform</span><span><b>💥</b>rapuh, cepat!</span><span><b>🌀</b>pegas super</span><span><b>⭐</b>shuriken dan kelelawar!</span></div>');
}
function start(){initWorld();st='play';banner=1.6;bannerT='LEVEL 1'}
function initWorld(){
  nj={x:W/2,y:500,vx:0,vy:JUMP,face:1};plats=[{x:W/2-PW/2,y:540,w:PW,t:'n',vx:0,bt:0,dead:false}];obs=[];coins=[];parts=[];petals=[];
  camY=0;topY=540;maxH=0;coinN=0;level=1;shield=0;inv=0;shake=0;over=0;sq=0;fillWorld();
  for(let i=0;i<14;i++)petals.push({x:rnd(0,W),y:rnd(0,H),v:rnd(20,50),s:rnd(3,6),p:rnd(0,6)});
}
function height(){return maxH}
function fillWorld(){
  while(topY>camY-120){
    const h=Math.max(0,(540-topY)/10),gap=rnd(68,70+Math.min(46,h/6)),y=topY-gap;
    const r=Math.random();let t='n';
    if(h>20&&r<.16)t='c';else if(h>60&&r<.34)t='m';else if(r>.93)t='s';
    const lx=plats.length?plats[plats.length-1].x:W/2-PW/2,x=cl(lx+rnd(-140,140),6,W-PW-6),p={x,y,w:PW,t,vx:t==='m'?rnd(50,90)*(Math.random()<.5?-1:1):0,bt:0,dead:false};plats.push(p);topY=y;
    if(Math.random()<.28)coins.push({x:x+PW/2,y:y-34,got:false});
    else if(Math.random()<.04)coins.push({x:x+PW/2,y:y-34,got:false,sh:true});
    if(h>35&&Math.random()<Math.min(.4,.06+h/700)){
      if(Math.random()<.55)obs.push({t:'s',x:Math.random()<.5?-30:W+30,y:y-rnd(30,90),vx:0,a:0});
      else obs.push({t:'b',x:rnd(30,W-30),y:y-rnd(40,100),b:0,ph:rnd(0,6)});
      const o=obs[obs.length-1];if(o.t==='s'){o.vx=(o.x<0?1:-1)*rnd(110,180+Math.min(120,h/4))}
    }
  }
}
function die(){
  if(st!=='play')return;st='dying';over=1.1;shake=12;sfx('hit');
  for(let i=0;i<24;i++)parts.push({x:nj.x,y:nj.y,vx:rnd(-220,220),vy:rnd(-300,50),l:rnd(.5,1.1),c:['#1b1f3a','#ff7a1a','#fff','#ff4d4d'][i%4],s:rnd(3,6)});
}
function finish(){
  st='over';const sc=height()+coinN*10,nr=sc>best;if(nr){best=sc;try{localStorage.setItem('ninjabest',best)}catch(e){}}
  show('💥','NINJA JATUH!','Skor: <b>'+sc+'</b><br>Tinggi: '+height()+' m · Koin: '+coinN+'<br>'+(nr?'🏆 Rekor baru!':'Rekor: '+best),[['Lompat lagi',start],['Menu',menu,'s2']]);
}

/* ---------- Input ---------- */
function setHold(e){const r=cv.getBoundingClientRect();hold=(e.clientX-r.left)<r.width/2?-1:1}
cv.addEventListener('pointerdown',e=>{e.preventDefault();setHold(e)});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setHold(e)});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{hold=0}));
const keys={};addEventListener('keydown',e=>{keys[e.key]=1});addEventListener('keyup',e=>{keys[e.key]=0});

/* ---------- Logika ---------- */
function update(dt){
  clock+=dt;shake=Math.max(0,shake-30*dt);banner=Math.max(0,banner-dt);inv=Math.max(0,inv-dt);sq=Math.max(0,sq-dt*4);
  for(const p of petals){p.y+=p.v*dt;p.x+=Math.sin(clock*1.5+p.p)*20*dt;if(p.y>H+10){p.y=-10;p.x=rnd(0,W)}}
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
  if(st==='menu'){return}
  if(st==='dying'){over-=dt;nj.vy+=GR*dt;nj.y+=nj.vy*dt;if(over<=0)finish();return}
  if(st!=='play')return;
  const dir=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0)||hold;
  nj.vx=lerp(nj.vx,dir*250,Math.min(1,dt*10));if(dir)nj.face=dir;
  const py=nj.y;nj.vy=Math.min(900,nj.vy+GR*dt);nj.y+=nj.vy*dt;nj.x+=nj.vx*dt;
  if(nj.x<-12)nj.x=W+12;if(nj.x>W+12)nj.x=-12;
  for(const p of plats){
    if(p.t==='m'){p.x+=p.vx*dt;if(p.x<0||p.x+p.w>W)p.vx*=-1}
    if(p.bt>0){p.bt-=dt;if(p.bt<=0)p.dead=true}
    if(p.dead)continue;
    if(nj.vy>0&&py+16<=p.y+2&&nj.y+16>=p.y&&nj.x>p.x-8&&nj.x<p.x+p.w+8){
      nj.vy=p.t==='s'?SPRING:JUMP;sq=1;sfx(p.t==='s'?'spring':'jump');
      if(p.t==='c'){p.bt=.3;sfx('crumble')}
      for(let i=0;i<5;i++)parts.push({x:nj.x,y:p.y,vx:rnd(-60,60),vy:rnd(-80,-10),l:.35,c:'#e8d9b0',s:3});
    }
  }
  if(nj.y<camY+260)camY=nj.y-260;
  const h=Math.max(0,Math.floor((524-nj.y)/10));if(h>maxH)maxH=h;
  const lv=1+Math.floor(maxH/250);if(lv>level){level=lv;banner=1.8;bannerT='LEVEL '+level;sfx('lvl')}
  fillWorld();
  plats=plats.filter(p=>p.y<camY+H+60&&!(p.dead&&p.y>camY+H));obs=obs.filter(o=>o.y<camY+H+80);coins=coins.filter(c=>c.y<camY+H+40&&!c.got);
  for(const c of coins){if(Math.hypot(c.x-nj.x,c.y-nj.y)<26){c.got=true;if(c.sh){shield=1;sfx('shield')}else{coinN++;sfx('coin')}}}
  for(const o of obs){
    if(o.t==='s'){o.x+=o.vx*dt;o.a+=dt*14;if(Math.abs(o.x-nj.x)<260&&Math.abs(o.y-nj.y)<30&&!o.w){o.w=1;sfx('whoosh')}}
    else{o.ph+=dt*3;o.b=Math.sin(o.ph)*40;}
    const ox=o.t==='b'?o.x+o.b:o.x,r=o.t==='s'?15:17;
    if(inv<=0&&Math.hypot(ox-nj.x,o.y-nj.y)<r+12){
      if(shield){shield=0;inv=1.2;o.y=camY+H+300;sfx('block');for(let i=0;i<14;i++)parts.push({x:nj.x,y:nj.y,vx:rnd(-200,200),vy:rnd(-200,200),l:.5,c:'#7cf',s:4})}
      else{die();return}
    }
  }
  if(nj.y>camY+H+30){st='dying';over=.6;sfx('fall')}
}

/* ---------- Gambar ---------- */
function rr(x,y,w,h,r,f){cx.beginPath();cx.roundRect(x,y,w,h,r);cx.fillStyle=f;cx.fill()}
function tx(s,x,y,sz,col,al){cx.font='900 '+sz+'px '+FONT;cx.textAlign=al||'center';cx.lineJoin='round';cx.lineWidth=sz/6;cx.strokeStyle='#12102a';cx.strokeText(s,x,y);cx.fillStyle=col;cx.fillText(s,x,y)}
function bg(){
  const T=TH[(level-1)%3],g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,T.a);g.addColorStop(1,T.b);cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.fillStyle=T.moon;cx.beginPath();cx.arc(280,90+camY*.02%40,30,0,7);cx.fill();
  cx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<22;i++)cx.fillRect((i*79)%W,(i*53+camY*.05)%H,1.6,1.6);
  const o1=(-camY*.12)%260,o2=(-camY*.25)%260;
  cx.fillStyle=T.m2;for(let k=-1;k<4;k++){const y=H-60+o1+k*260;cx.beginPath();cx.moveTo(0,y);cx.lineTo(90,y-150);cx.lineTo(190,y);cx.lineTo(260,y-110);cx.lineTo(360,y);cx.lineTo(360,y+260);cx.lineTo(0,y+260);cx.fill()}
  cx.fillStyle=T.m;for(let k=-1;k<4;k++){const y=H-10+o2+k*260;cx.beginPath();cx.moveTo(0,y);cx.lineTo(60,y-90);cx.lineTo(150,y);cx.lineTo(230,y-130);cx.lineTo(330,y);cx.lineTo(360,y-40);cx.lineTo(360,y+260);cx.lineTo(0,y+260);cx.fill()}
  cx.fillStyle='rgba(30,40,30,.35)';for(const x of[18,342])for(let k=0;k<12;k++){const y=((k*60-camY*.35)%720+720)%720-60;cx.fillRect(x-5,y,10,56);cx.fillStyle='rgba(60,90,50,.5)';cx.fillRect(x-6,y+24,12,3);cx.fillStyle='rgba(30,40,30,.35)'}
  cx.fillStyle='rgba(255,182,203,.85)';for(const p of petals){cx.beginPath();cx.ellipse(p.x,p.y,p.s,p.s*.6,p.p+clock,0,7);cx.fill()}
}
function platform(p){
  const y=p.y-camY;if(y<-30||y>H+30||p.dead)return;
  let col='#9a6a3a',top='#c18a50';
  if(p.t==='c'){col='#b59a72';top='#d9c49a'}if(p.t==='m'){col='#5a7a8a';top='#86a8b8'}if(p.t==='s'){col='#4f8a3c';top='#7cc455'}
  const sh=p.bt>0?Math.sin(clock*60)*2:0;
  rr(p.x+sh,y,p.w,14,6,col);rr(p.x+sh,y,p.w,6,6,top);
  cx.fillStyle='rgba(0,0,0,.25)';for(let i=1;i<4;i++)cx.fillRect(p.x+sh+i*p.w/4,y+2,2,11);
  cx.strokeStyle='#d8c9a0';cx.lineWidth=2;cx.beginPath();cx.moveTo(p.x+6,y+14);cx.lineTo(p.x+6,y+22);cx.moveTo(p.x+p.w-6,y+14);cx.lineTo(p.x+p.w-6,y+22);cx.stroke();
  if(p.t==='c'){cx.strokeStyle='rgba(60,30,10,.6)';cx.lineWidth=2;cx.beginPath();cx.moveTo(p.x+20,y);cx.lineTo(p.x+28,y+14);cx.moveTo(p.x+50,y);cx.lineTo(p.x+44,y+14);cx.stroke()}
  if(p.t==='m'){tx('↔',p.x+p.w/2,y+12,13,'#fff')}
  if(p.t==='s'){cx.strokeStyle='#2c5a1e';cx.lineWidth=4;cx.beginPath();for(let i=0;i<4;i++){cx.moveTo(p.x+p.w/2-12,y-i*5);cx.lineTo(p.x+p.w/2+12,y-i*5-2)}cx.stroke();rr(p.x+p.w/2-16,y-24,32,6,3,'#ff7a45')}
}
function ninja(){
  const x=nj.x,y=nj.y-camY,f=nj.face,fall=nj.vy>0,s=1+sq*.18*(nj.vy<0?-.5:1);
  if(inv>0&&Math.floor(clock*14)%2)return;
  cx.save();cx.translate(x,y);cx.scale(f,1);
  cx.fillStyle='#ff7a1a';cx.beginPath();const w=Math.sin(clock*14)*4;cx.moveTo(-8,-10);cx.quadraticCurveTo(-26,-10+w,-38,-2+w*1.4+(fall?-8:6));cx.lineTo(-36,6+w);cx.quadraticCurveTo(-22,2,-6,-2);cx.fill();
  cx.save();cx.scale(1,s);
  cx.strokeStyle='#161a33';cx.lineWidth=7;cx.lineCap='round';cx.beginPath();
  if(fall){cx.moveTo(-5,10);cx.lineTo(-9,22);cx.moveTo(5,10);cx.lineTo(9,22)}else{cx.moveTo(-5,10);cx.lineTo(-12,16);cx.lineTo(-4,22);cx.moveTo(5,10);cx.lineTo(10,15);cx.lineTo(3,22)}
  cx.stroke();
  rr(-11,-12,22,26,8,'#1b1f3a');rr(-11,2,22,5,2,'#ff4d4d');
  cx.strokeStyle='#1b1f3a';cx.lineWidth=6;cx.beginPath();cx.moveTo(8,-6);cx.lineTo(fall?18:16,fall?-14:-18);cx.moveTo(-8,-6);cx.lineTo(-16,fall?0:-4);cx.stroke();
  cx.fillStyle='#161a33';cx.beginPath();cx.arc(0,-20,11,0,7);cx.fill();
  cx.fillStyle='#f3c9a0';cx.fillRect(-9,-24,18,7);cx.fillStyle='#fff';cx.beginPath();cx.ellipse(4,-21,3,2.2,0,0,7);cx.ellipse(-3,-21,2.4,2,0,0,7);cx.fill();cx.fillStyle='#111';cx.fillRect(3,-22,2,2.6);
  cx.fillStyle='#ff4d4d';cx.fillRect(-11,-29,22,4);cx.beginPath();cx.moveTo(-10,-27);cx.lineTo(-22,-24+Math.sin(clock*12)*3);cx.lineTo(-10,-24);cx.fill();
  cx.strokeStyle='#cfd6e6';cx.lineWidth=2.6;cx.beginPath();cx.moveTo(-8,8);cx.lineTo(8,-22);cx.stroke();
  cx.restore();
  if(shield){cx.strokeStyle='rgba(120,200,255,.9)';cx.lineWidth=3;cx.fillStyle='rgba(120,200,255,.18)';cx.beginPath();cx.arc(0,-4,32,0,7);cx.fill();cx.stroke()}
  cx.restore();
}
function obstacle(o){
  const y=o.y-camY;if(y<-30||y>H+30)return;
  if(o.t==='s'){cx.save();cx.translate(o.x,y);cx.rotate(o.a);cx.fillStyle='#cfd6e6';cx.strokeStyle='#161a33';cx.lineWidth=2.5;cx.beginPath();for(let i=0;i<4;i++){const a=i*Math.PI/2;cx.lineTo(Math.cos(a)*17,Math.sin(a)*17);cx.lineTo(Math.cos(a+.785)*6,Math.sin(a+.785)*6)}cx.closePath();cx.fill();cx.stroke();cx.fillStyle='#161a33';cx.beginPath();cx.arc(0,0,3.4,0,7);cx.fill();cx.restore()}
  else{const x=o.x+o.b,f=Math.sin(clock*16)*9;cx.save();cx.translate(x,y);cx.fillStyle='#4b2a63';cx.beginPath();cx.moveTo(0,-3);cx.quadraticCurveTo(-22,-14+f,-30,-2+f);cx.quadraticCurveTo(-18,0,-10,8);cx.lineTo(0,3);cx.lineTo(10,8);cx.quadraticCurveTo(18,0,30,-2+f);cx.quadraticCurveTo(22,-14+f,0,-3);cx.fill();cx.beginPath();cx.ellipse(0,0,8,10,0,0,7);cx.fill();cx.fillStyle='#ff4d4d';cx.fillRect(-4,-3,3,3);cx.fillRect(2,-3,3,3);cx.fillStyle='#fff';cx.fillRect(-3,4,2,3);cx.fillRect(1,4,2,3);cx.restore()}
}
function hud(){
  rr(8,8,W-16,46,14,'rgba(18,12,36,.78)');
  cx.font='700 12px system-ui,sans-serif';cx.fillStyle='#e0d8ff';cx.textAlign='left';cx.fillText('🪙 '+coinN,20,26);cx.fillText('LV '+level,20,44);
  cx.textAlign='right';cx.fillText('REKOR '+best,W-20,26);if(shield)cx.fillText('🛡️ aktif',W-20,44);
  tx(String(height()+coinN*10),W/2,44,34,'#ffd23f');
}
function render(){
  cx.setTransform(2,0,0,2,0,0);cx.save();if(shake>0)cx.translate(rnd(-shake,shake),rnd(-shake,shake));
  bg();
  for(const c of coins){if(c.got)continue;const y=c.y-camY;if(y<-20||y>H+20)continue;
    if(c.sh){cx.fillStyle='rgba(120,200,255,.35)';cx.beginPath();cx.arc(c.x,y,15,0,7);cx.fill();cx.strokeStyle='#7cf';cx.lineWidth=3;cx.stroke();cx.fillStyle='#fff';cx.font='14px system-ui';cx.textAlign='center';cx.fillText('🛡️',c.x,y+5)}
    else{const sx=Math.abs(Math.cos(clock*4+c.x));cx.fillStyle='#ffb703';cx.beginPath();cx.ellipse(c.x,y,8*sx+2,8,0,0,7);cx.fill();cx.fillStyle='#ffe066';cx.beginPath();cx.ellipse(c.x,y,4*sx+1,4.5,0,0,7);cx.fill()}}
  plats.forEach(platform);obs.forEach(obstacle);
  if(st!=='menu')ninja();
  for(const p of parts){cx.globalAlpha=cl(p.l*2,0,1);cx.fillStyle=p.c;cx.fillRect(p.x,p.y-camY,p.s,p.s)}
  cx.globalAlpha=1;cx.restore();
  if(st==='play'||st==='dying')hud();
  if(banner>0&&st==='play'){cx.globalAlpha=cl(banner,0,1);tx(bannerT,W/2,300,46,'#fff');tx(TH[(level-1)%3].n,W/2,340,22,'#ffd23f');cx.globalAlpha=1}
}
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script>
