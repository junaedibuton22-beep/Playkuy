<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="PlayKuy – portal game browser. Main langsung dari HP atau komputer, tanpa install.">
<title>PlayKuy – Portal Game</title>
<style>
:root{
  --bg:#f4f5fb;--surface:#ffffff;--ink:#141a2e;--mute:#5d667c;--line:#e1e4ef;
  --a1:#ff6b35;--a2:#ffb703;--brand:#5b4bff;--shadow:0 6px 24px rgba(30,40,90,.10);
  color-scheme:light dark;box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1120;--surface:#161e36;--ink:#eef1fb;--mute:#9aa5c4;--line:#26314f;--brand:#8b80ff;--shadow:0 6px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0c1120;--surface:#161e36;--ink:#eef1fb;--mute:#9aa5c4;--line:#26314f;--brand:#8b80ff;--shadow:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Header */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:14px;padding:12px 0}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font:900 26px/1 Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;letter-spacing:.5px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;flex:none}
.logo i::after{content:"";border-left:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.logo b{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;font:500 15px system-ui,sans-serif;padding:11px 14px 11px 40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round}

/* Hero */
.hero{padding:26px 0 10px}
.hero h1{margin:0 0 8px;font-size:clamp(26px,6vw,44px);line-height:1.1;letter-spacing:-.5px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--mute);max-width:520px}
.stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stats span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}

/* Toolbar */
.tools{display:flex;gap:10px;align-items:center;margin:18px 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 14px system-ui,sans-serif;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#fff}
select{flex:none;font:600 14px system-ui,sans-serif;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
@media (hover:hover){.card:hover{transform:translateY(-4px);border-color:var(--brand)}.card:hover .play{filter:brightness(1.1)}}
.card:active{transform:scale(.98)}
.cv{position:relative;aspect-ratio:5/3;background:var(--line);overflow:hidden}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(28px,8vw,42px) Impact,sans-serif;color:rgba(255,255,255,.92)}
.badge{position:absolute;top:8px;left:8px;background:var(--a1);color:#fff;font:800 10px system-ui,sans-serif;letter-spacing:.6px;padding:3px 8px;border-radius:999px}
.bd{display:flex;flex-direction:column;gap:5px;padding:10px 12px 12px;flex:1}
.bd h3{margin:0;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd p{margin:0;color:var(--mute);font-size:13px;display:none;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
@media (min-width:700px){.bd p{display:-webkit-box}.bd h3{font-size:17px}}
.meta{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:4px}
.tag{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{flex:none;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-weight:800;font-size:13px;padding:7px 14px;border-radius:999px}

/* Slot "segera hadir" */
.soon{display:flex;align-items:center;justify-content:center;text-align:center;min-height:170px;border:2px dashed var(--line);border-radius:16px;color:var(--mute);font-size:14px;font-weight:600;padding:16px}
.more{display:block;margin:22px auto 0;font:700 15px system-ui,sans-serif;padding:12px 28px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:40px 0}
footer{margin-top:44px;border-top:1px solid var(--line);padding:22px 0 calc(28px + env(safe-area-inset-bottom,0px));color:var(--mute);font-size:13px;text-align:center}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="./" aria-label="PlayKuy, beranda"><i></i><b>PlayKuy</b></a>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Cari game…" autocomplete="off" aria-label="Cari game">
    </label>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Main game seru, <em>langsung dari browser.</em></h1>
    <p>Tanpa download, tanpa install. Pilih game, ketuk, dan mulai bermain di HP atau komputer.</p>
    <div class="stats" id="stats"></div>
  </section>

  <div class="tools">
    <div class="chips" id="chips" role="group" aria-label="Kategori game"></div>
    <select id="sort" aria-label="Urutkan">
      <option value="baru">Terbaru</option>
      <option value="az">A–Z</option>
    </select>
  </div>

  <div class="grid" id="grid" aria-live="polite"></div>
  <button class="more" id="more" hidden>Muat lebih banyak</button>
</main>

<footer><div class="wrap">© <span id="yr"></span> PlayKuy · Portal game browser</div></footer>

<script>
/* =====================================================================
   DAFTAR GAME PLAYKUY
   ---------------------------------------------------------------------
   Cara menambah game baru (3 langkah):
   1. Taruh file game (mis. "balap-motor.html") di folder yang sama dengan index.html.
   2. Taruh gambar cover di folder yang sama. Nama otomatis yang dicari:
        cover-<nama-file-game>.svg / .png / .jpg / .webp
        (contoh: cover-balap-motor.png). Atau tulis nama file cover sendiri
        lewat properti "cover".
   3. Tambahkan satu baris di GAMES di bawah ini. Urutan baris TIDAK berpengaruh:
      pasangan game dan cover ditentukan oleh nama file, bukan urutan.

   Properti:
     file      (wajib)  nama file game, mis. "balap-motor.html"
     judul     (wajib)  judul yang tampil di kartu
     kategori  (wajib)  mis. "Fighter", "Olahraga", "Puzzle", "Balap"
     deskripsi (opsional) satu-dua kalimat, tampil di layar lebar
     cover     (opsional) nama file cover bila tidak mengikuti aturan otomatis
     tgl       (opsional) "TTTT-BB-HH". Dipakai untuk urutan "Terbaru" dan
               label BARU (14 hari pertama)
   ===================================================================== */
const GAMES = [
  { file:'jagoan-silat.html', judul:'Jagoan Silat', kategori:'Fighter',
    deskripsi:'Duel silat di pantai senja. Menangkan 2 dari 3 ronde, lawan makin tangguh setiap kali kamu menang.',
    cover:'cover-jagoan-silat.svg', tgl:'2026-11-12' },
  { file:'karier-bola.html', judul:'Karier Bola', kategori:'Olahraga',
    deskripsi:'Pilih nomor punggung, posisi, dan klub. Bangun kariermu dari remaja sampai jadi legenda sepak bola.',
    cover:'cover-karier-bola.svg', tgl:'2026-11-13' },
  // ↓ TAMBAHKAN GAME BARU DI SINI ↓
];

const PAGE = 24;                       // jumlah kartu per tahap
const EXTS = ['svg','png','jpg','jpeg','webp'];
const $ = id => document.getElementById(id);
const grid=$('grid'), chips=$('chips'), more=$('more');
const state = { q:'', cat:'Semua', sort:'baru', shown:PAGE };

const slug = g => g.file.replace(/\.html?$/i,'');
const isNew = g => g.tgl && (Date.now()-new Date(g.tgl))/864e5 <= 14;
const el = (t,c,x) => { const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e };
const hue = s => { let h=0; for(const ch of s)h=(h*31+ch.charCodeAt(0))%360; return h };

/* Cover: coba nama eksplisit lebih dulu, lalu aturan otomatis berdasar nama file.
   Kalau semuanya gagal, tampilkan sampul pengganti berwarna dengan inisial judul. */
function coverNode(g){
  const box = el('div','cv');
  const list = [...new Set([g.cover, ...EXTS.map(x=>'cover-'+slug(g)+'.'+x)].filter(Boolean))];
  const img = new Image(); let i = 0;
  img.alt = 'Cover ' + g.judul; img.loading = 'lazy'; img.decoding = 'async';
  img.onerror = () => {
    if (++i < list.length) { img.src = list[i]; return }
    img.remove();
    const h = hue(slug(g)), ph = el('div','ph', g.judul.split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase());
    ph.style.background = `linear-gradient(135deg,hsl(${h} 70% 42%),hsl(${(h+50)%360} 75% 55%))`;
    box.prepend(ph);
  };
  img.src = list[0];
  box.append(img);
  if (isNew(g)) box.append(el('span','badge','BARU'));
  return box;
}

function card(g){
  const a = el('a','card'); a.href = g.file; a.setAttribute('aria-label','Main '+g.judul);
  const bd = el('div','bd');
  const meta = el('div','meta'); meta.append(el('span','tag',g.kategori), el('span','play','▶ Main'));
  bd.append(el('h3',null,g.judul));
  if (g.deskripsi) bd.append(el('p',null,g.deskripsi));
  bd.append(meta);
  a.append(coverNode(g), bd);
  return a;
}

function visible(){
  const q = state.q.trim().toLowerCase();
  let list = GAMES.filter(g =>
    (state.cat==='Semua' || g.kategori===state.cat) &&
    (!q || [g.judul,g.kategori,g.deskripsi||''].join(' ').toLowerCase().includes(q)));
  list = list.slice().sort(state.sort==='az'
    ? (a,b)=>a.judul.localeCompare(b.judul,'id')
    : (a,b)=>(b.tgl||'').localeCompare(a.tgl||'') || a.judul.localeCompare(b.judul,'id'));
  return list;
}

function render(){
  const list = visible(), part = list.slice(0,state.shown), f = document.createDocumentFragment();
  part.forEach(g => f.append(card(g)));
  const filtering = state.q.trim() || state.cat!=='Semua';
  if (!filtering && part.length === list.length) f.append(el('div','soon','Game baru segera hadir ✨'));
  grid.replaceChildren(f);
  if (!list.length) grid.replaceChildren(el('div','empty','Tidak ada game yang cocok. Coba kata kunci atau kategori lain.'));
  const rest = list.length - part.length;
  more.hidden = rest <= 0; more.textContent = 'Muat lebih banyak ('+rest+')';
}

function buildChips(){
  const cats = ['Semua', ...new Set(GAMES.map(g=>g.kategori))];
  chips.replaceChildren(...cats.map(c => {
    const b = el('button','chip',c); b.type='button'; b.setAttribute('aria-pressed', String(c===state.cat));
    b.onclick = () => { state.cat=c; state.shown=PAGE; [...chips.children].forEach(x=>x.setAttribute('aria-pressed',String(x===b))); render() };
    return b;
  }));
  $('stats').replaceChildren(el('span',null,GAMES.length+' game'), el('span',null,(cats.length-1)+' kategori'), el('span',null,'Gratis · tanpa install'));
}

$('q').addEventListener('input', e => { state.q=e.target.value; state.shown=PAGE; render() });
$('sort').addEventListener('change', e => { state.sort=e.target.value; state.shown=PAGE; render() });
more.addEventListener('click', () => { state.shown += PAGE; render() });
$('yr').textContent = new Date().getFullYear();
buildChips(); render();
</script>
</body>
</html>
