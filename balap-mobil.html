<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Balap Hindari Mobil</title>
<style>
:root{color-scheme:dark;--bg:#0d1224;--a:#ffd23f;--b:#ff5a36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:8px}
#pad{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 14px 14px}
#pad button{height:72px;font:900 32px system-ui,sans-serif;color:#fff;border:0;border-radius:18px;background:linear-gradient(135deg,#2dc6ff,#6a5cff);box-shadow:0 6px 0 #2f35a8;touch-action:none}
#pad button:last-child{background:linear-gradient(135deg,#ff4fa3,#ff8c1a);box-shadow:0 6px 0 #a8431c}
#pad button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(13,18,36,.88);overflow-y:auto}
#ov.h{display:none}
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#ov h1{font:900 42px/1.05 Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;margin:0 0 8px;background:linear-gradient(90deg,#ffd23f,#ff5a36,#ff4fa3);-webkit-background-clip:text;background-clip:text;color:transparent}
#ov p{margin:0 0 14px;max-width:320px;line-height:1.45;font-size:15px;color:#cdd3f5}
#ov button{font:800 18px system-ui,sans-serif;padding:14px 22px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff5a36,#ffb703);color:#fff;width:100%;max-width:320px;margin-bottom:10px}
#ov button.s2{background:#25305e}
.cars{display:flex;gap:10px;justify-content:center;margin:0 0 16px}
.cars i{width:26px;height:44px;border-radius:8px;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 -10px 0 rgba(0,0,0,.25)}
.cars i.on{border-color:#fff;transform:scale(1.15)}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="ov"></div></div>
<div id="pad"><button id="bl" aria-label="Kiri">◀</button><button id="br" aria-label="Kanan">▶</button></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),cx=cv.getContext('2d'),ov=$('ov');
const W=360,H=600,LN=4,RX=30,LW=75,PY=470,FONT='Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif';
cv.width=W*2;cv.height=H*2;
const CARS=['#e63946','#2f6fe0','#ffd23f','#2dc653','#a855f7','#ff8c1a'];
const TH=[{n:'PAGI',g:'#3bb54a',g2:'#35a843',r:'#3d4252',d:'tree'},{n:'GURUN',g:'#e8c26b',g2:'#dcb35a',r:'#4a4440',d:'cactus'},{n:'SENJA',g:'#2f8f55',g2:'#2a8450',r:'#403a52',d:'palm',tint:'rgba(255,110,40,.2)'},{n:'MALAM',g:'#1f5b3a',g2:'#1a5034',r:'#2b2f40',d:'lamp',tint:'rgba(5,8,34,.58)'}];
const TRAF=['#2f6fe0','#2dc653','#ffd23f','#a855f7','#ff8c1a','#19c6c6','#f5f5f5','#ff4fa3'];
const lx=i=>RX+LW*(i+.5),rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let st='menu',color=0,dist=0,speed=0,lane=1,px=lx(1),obs=[],coins=[],parts=[],pops=[],shield=0,inv=0,nCoin=0,bonus=0,sp=0,ofs=0,th=0,thT=0,shake=0,rdy=0,over=0,best=0,clock=0,last=performance.now(),mute=false,AC=null,eng=null;
try{best=+localStorage.getItem('balapbest')||0;mute=localStorage.getItem('balapmute')==='1'}catch(e){}

/* ---------- SFX ---------- */
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty,v,t0,f2){const a=ac();if(!a)return;const t=a.currentTime+(t0||0),o=a.createOscillator(),q=a.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);q.gain.setValueAtTime(.0001,t);q.gain.exponentialRampToValueAtTime(v||.2,t+.01);q.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(q);q.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,t0,fl){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),q=a.createGain(),t=a.currentTime+(t0||0);s.buffer=b;f.type='bandpass';f.frequency.value=fl||1200;q.gain.setValueAtTime(.0001,t);q.gain.exponentialRampToValueAtTime(v,t+Math.min(.2,d/3));q.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(q);q.connect(a.destination);s.start(t)}
function engStart(){const a=ac();if(!a||mute)return;engStop();const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type='sawtooth';f.type='lowpass';f.frequency.value=420;g.gain.value=.045;o.connect(f);f.connect(g);g.connect(a.destination);o.start();eng={o}}
function engStop(){if(eng){try{eng.o.stop()}catch(e){}eng=null}}
function sfx(k){
  if(mute)return;
  if(k==='click')tone(660,.06,'square',.05);
  else if(k==='move')tone(420,.05,'square',.03,0,300);
  else if(k==='coin'){tone(988,.08,'square',.07);tone(1319,.14,'square',.07,.07)}
  else if(k==='near'){noise(.25,.1,0,2600)}
  else if(k==='shield'){[523,659,784].forEach((f,i)=>tone(f,.15,'triangle',.12,i*.07))}
  else if(k==='block'){noise(.25,.25,0,1500);tone(300,.2,'square',.1,0,120)}
  else if(k==='crash'){noise(.9,.4,0,350);tone(130,.6,'sawtooth',.28,0,40)}
  else if(k==='theme'){[660,880,1100].forEach((f,i)=>tone(f,.18,'triangle',.1,i*.1))}
  else if(k==='go'){tone(880,.25,'square',.08)}
}
document.addEventListener('pointerdown',e=>{ac();if(e.target.closest&&e.target.closest('#ov button'))sfx('click')});
const mb=document.createElement('button');
mb.setAttribute('style','position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;background:rgba(13,18,36,.85);color:#fff;border:1px solid #4a56a0;border-radius:20px;padding:6px 12px;font-size:18px');
mb.setAttribute('aria-label','Suara');mb.textContent=mute?'🔇':'🔊';
mb.onclick=()=>{mute=!mute;mb.textContent=mute?'🔇':'🔊';if(mute)engStop();else if(st==='play')engStart();try{localStorage.setItem('balapmute',mute?'1':'0')}catch(e){}};
document.body.appendChild(mb);

/* ---------- Layar ---------- */
function fit(){const s=$('stage'),k=Math.min(s.clientWidth/W,s.clientHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px'}
addEventListener('resize',fit);fit();
function show(h,p,btns,pre){
  ov.innerHTML='<h1>'+h+'</h1><p>'+p+'</p>';
  if(pre)ov.appendChild(pre);
  btns.forEach(([t,fn,c])=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=()=>{ov.classList.add('h');fn()};ov.appendChild(b)});
  ov.classList.remove('h');
}
function menu(){
  st='menu';engStop();
  const k=document.createElement('div');k.className='cars';
  CARS.forEach((c,i)=>{const d=document.createElement('i');d.style.background=c;if(i===color)d.className='on';d.onclick=()=>{color=i;[...k.children].forEach(x=>x.classList.remove('on'));d.classList.add('on')};k.appendChild(d)});
  show('🚗 BALAP HINDARI MOBIL','Mobilmu terus melaju. Geser jalur kiri atau kanan untuk menghindari kendaraan lain, ambil koin, dan bertahan sejauh mungkin. Rekor: '+best+'.',[['Mulai Balap',start]],k);
}
function start(){
  st='play';dist=0;speed=280;lane=1;px=lx(1);obs=[];coins=[];parts=[];pops=[];shield=0;inv=0;nCoin=0;bonus=0;sp=200;th=0;thT=0;shake=0;rdy=1;over=0;
  engStart();sfx('go');
}
function move(d){if(st!=='play')return;const n=cl(lane+d,0,LN-1);if(n!==lane){lane=n;sfx('move')}}
$('bl').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});
$('br').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();move((e.clientX-r.left)<r.width/2?-1:1)});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1)});

/* ---------- Logika ---------- */
function spawn(){
  const n=Math.random()<.62?1:2,free=[0,1,2,3],used=[];
  for(let i=0;i<n;i++){
    const l=free.splice(Math.random()*free.length|0,1)[0];used.push(l);
    const r=Math.random(),t=r<.2?'truck':r<.4?'van':'sedan',w=t==='truck'?46:40,h=t==='truck'?112:t==='van'?84:70;
    obs.push({lane:l,x:lx(l),y:-90,w,h,t,col:t==='truck'?['#f5f5f5','#2f6fe0','#ff8c1a'][Math.random()*3|0]:TRAF[Math.random()*TRAF.length|0],ov:rnd(80,170),py:-90,pass:false});
  }
  if(Math.random()<.5&&free.length){const l=free[Math.random()*free.length|0];for(let k=0;k<3;k++)coins.push({x:lx(l),y:-60-k*42,k:0})}
  else if(Math.random()<.07&&free.length){coins.push({x:lx(free[Math.random()*free.length|0]),y:-70,k:1})}
  sp=Math.max(190,300-speed*.18)+rnd(0,80);
}
function boom(x,y,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-220,220),vy:rnd(-260,120),l:rnd(.5,1.1),c:['#ff5a36','#ffd23f','#fff','#777'][i%4],s:rnd(3,7)})}
function crash(){
  st='crashing';over=.9;shake=14;engStop();sfx('crash');boom(px,PY,50);
}
function score(){return Math.floor(dist)+nCoin*10+bonus}
function update(dt){
  clock+=dt;
  if(st==='play'){
    rdy=Math.max(0,rdy-dt);
    speed=Math.min(600,280+dist*.35);dist+=speed*dt/20;ofs+=speed*dt;
    px+=(lx(lane)-px)*Math.min(1,dt*14);inv=Math.max(0,inv-dt);
    sp-=speed*dt;if(sp<=0)spawn();
    const nt=Math.floor(dist/400)%TH.length;if(nt!==th){th=nt;thT=2;sfx('theme')}
    thT=Math.max(0,thT-dt);
    for(const o of obs){o.py=o.y;o.y+=(speed-o.ov)*dt;
      if(!o.pass&&o.y>PY&&o.py<=PY){o.pass=true;const dx=Math.abs(o.x-px);if(dx>LW*.55&&dx<LW*1.1){bonus+=15;pops.push({t:'DEKAT! +15',x:px,y:PY-60,l:1,c:'#2dc6ff'});sfx('near')}}
      if(Math.abs(o.x-px)<o.w/2+13&&Math.abs(o.y-PY)<o.h/2+30){
        if(inv>0){}else if(shield>0){shield=0;inv=1.2;o.y=H+300;boom(o.x,o.y,0);boom(px,PY-30,18);sfx('block');pops.push({t:'PERISAI PECAH',x:px,y:PY-70,l:1.2,c:'#7cf'})}
        else{crash();break}
      }
    }
    for(const c of coins){c.y+=speed*dt;
      if(Math.abs(c.x-px)<28&&Math.abs(c.y-PY)<40&&!c.got){c.got=1;
        if(c.k){shield=1;sfx('shield');pops.push({t:'PERISAI!',x:px,y:PY-60,l:1,c:'#7cf'})}else{nCoin++;sfx('coin');pops.push({t:'+10',x:c.x,y:c.y-20,l:.7,c:'#ffd23f'})}}}
    obs=obs.filter(o=>o.y<H+140);coins=coins.filter(c=>c.y<H+40&&!c.got);
    if(eng)eng.o.frequency.value=50+speed*.16;
  }else if(st==='crashing'){
    over-=dt;ofs+=speed*dt*.15;
    if(over<=0){
      st='over';const s=score(),nr=s>best;if(nr){best=s;try{localStorage.setItem('balapbest',best)}catch(e){}}
      show('💥 TABRAKAN!','Skor: <b>'+s+'</b><br>Jarak: '+Math.floor(dist)+' m · Koin: '+nCoin+'<br>'+(nr?'🏆 Rekor baru!':'Rekor: '+best),[['Balap lagi',start],['Menu',menu,'s2']]);
    }
  }else ofs+=140*dt;
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.l-=dt}
  parts=parts.filter(p=>p.l>0);
  for(const p of pops){p.y-=30*dt;p.l-=dt}pops=pops.filter(p=>p.l>0);
  shake=Math.max(0,shake-26*dt);
}

/* ---------- Gambar ---------- */
function rr(x,y,w,h,r,f){cx.beginPath();cx.roundRect(x,y,w,h,r);cx.fillStyle=f;cx.fill()}
function tx(s,x,y,sz,col,al){cx.font='900 '+sz+'px '+FONT;cx.textAlign=al||'center';cx.lineJoin='round';cx.lineWidth=sz/6;cx.strokeStyle='#10142e';cx.strokeText(s,x,y);cx.fillStyle=col;cx.fillText(s,x,y)}
function deco(T,side){
  const o=ofs%120;
  for(let i=-1;i<7;i++){
    const y=i*120+o,x=side<0?14+((i*37)%5):W-14-((i*53)%5);
    if(T.d==='tree'||T.d==='palm'){cx.fillStyle='#6b4a2a';cx.fillRect(x-2,y,4,14);cx.fillStyle=T.d==='palm'?'#2f9a4a':'#1f8f3a';cx.beginPath();cx.arc(x,y-4,13,0,7);cx.fill();cx.fillStyle='rgba(255,255,255,.15)';cx.beginPath();cx.arc(x-4,y-8,5,0,7);cx.fill()}
    else if(T.d==='cactus'){cx.fillStyle='#2f8a3c';rr(x-4,y-14,8,30,4,'#2f8a3c');rr(x-12,y-6,8,5,2,'#2f8a3c');rr(x-12,y-12,4,8,2,'#2f8a3c');rr(x+4,y-2,8,5,2,'#2f8a3c');rr(x+8,y-8,4,8,2,'#2f8a3c')}
    else{cx.fillStyle='#8a8fa8';cx.fillRect(x-1.5,y-20,3,34);cx.fillStyle='rgba(255,230,140,.35)';cx.beginPath();cx.arc(x,y-22,16,0,7);cx.fill();cx.fillStyle='#ffe08a';cx.beginPath();cx.arc(x,y-22,4,0,7);cx.fill()}
  }
}
function road(){
  const T=TH[th];
  cx.fillStyle=T.g;cx.fillRect(0,0,W,H);
  cx.fillStyle=T.g2;const o=ofs%80;for(let y=-80;y<H;y+=80)cx.fillRect(0,y+o,W,40);
  deco(T,-1);deco(T,1);
  cx.fillStyle=T.r;cx.fillRect(RX,0,LW*LN,H);
  const o2=ofs%40;
  for(let y=-40;y<H;y+=40){cx.fillStyle=(Math.floor((y+o2)/40)%2)?'#fff':'#e63946';cx.fillRect(RX-8,y+o2,8,20);cx.fillRect(RX+LW*LN,y+o2,8,20)}
  cx.fillStyle='#fff';cx.fillRect(RX,0,3,H);cx.fillRect(RX+LW*LN-3,0,3,H);
  const o3=ofs%60;cx.fillStyle='rgba(255,255,255,.8)';
  for(let l=1;l<LN;l++)for(let y=-60;y<H;y+=60)cx.fillRect(RX+LW*l-2,y+o3,4,30);
}
function car(x,y,w,h,col,tilt,night){
  cx.save();cx.translate(x,y);cx.rotate(tilt||0);
  cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.roundRect(-w/2+4,-h/2+6,w,h,10);cx.fill();
  cx.fillStyle='#111';for(const sy of[-.3,.3])for(const sx of[-1,1])cx.fillRect(sx*(w/2)-(sx>0?1:4),sy*h-8,5,16);
  rr(-w/2,-h/2,w,h,10,col);
  rr(-w/2+3,-h/2+3,w-6,h*.22,8,'rgba(255,255,255,.2)');
  rr(-w/2+5,-h*.06,w-10,h*.2,4,'#16233a');
  rr(-w/2+5,-h*.34,w-10,h*.22,5,'rgba(0,0,0,.18)');
  if(night){cx.fillStyle='rgba(255,60,60,.35)';cx.beginPath();cx.arc(-w/2+8,h/2-5,9,0,7);cx.arc(w/2-8,h/2-5,9,0,7);cx.fill()}
  rr(-w/2+3,h/2-9,10,5,2,'#ff3b3b');rr(w/2-13,h/2-9,10,5,2,'#ff3b3b');
  cx.restore();
}
function truck(o,night){
  cx.save();cx.translate(o.x,o.y);const w=o.w,h=o.h;
  cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.roundRect(-w/2+4,-h/2+6,w,h,6);cx.fill();
  cx.fillStyle='#111';for(const sy of[-.32,.05,.34])for(const sx of[-1,1])cx.fillRect(sx*(w/2)-(sx>0?1:4),sy*h-8,5,16);
  rr(-w/2,-h/2,w,h,6,o.col);rr(-w/2+3,-h/2+3,w-6,h-24,4,'rgba(255,255,255,.18)');
  cx.fillStyle='rgba(0,0,0,.18)';cx.fillRect(-w/2+3,-h*.1,w-6,4);cx.fillRect(-w/2+3,h*.15,w-6,4);
  rr(-w/2+3,h/2-9,10,5,2,'#ff3b3b');rr(w/2-13,h/2-9,10,5,2,'#ff3b3b');cx.restore();
}
function render(){
  cx.setTransform(2,0,0,2,0,0);
  cx.save();if(shake>0)cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  road();
  const T=TH[th];
  if(T.tint){cx.fillStyle=T.tint;cx.fillRect(0,0,W,H)}
  const night=th===3;
  for(const c of coins){
    if(c.k){cx.fillStyle='rgba(120,200,255,.35)';cx.beginPath();cx.arc(c.x,c.y,17+Math.sin(clock*8)*2,0,7);cx.fill();cx.strokeStyle='#7cf';cx.lineWidth=3;cx.beginPath();cx.arc(c.x,c.y,11,0,7);cx.stroke();tx('+',c.x,c.y+6,18,'#fff')}
    else{const sx=Math.abs(Math.cos(clock*5+c.y*.02));cx.fillStyle='#ffb703';cx.beginPath();cx.ellipse(c.x,c.y,10*sx+2,10,0,0,7);cx.fill();cx.fillStyle='#ffe066';cx.beginPath();cx.ellipse(c.x,c.y,6*sx+1,6,0,0,7);cx.fill()}
  }
  for(const o of obs){if(o.t==='truck')truck(o,night);else car(o.x,o.y,o.w,o.h,o.col,0,night)}
  if(st!=='crashing'&&st!=='over'&&st!=='menu'||st==='menu'){
    if(night&&st==='play'){const g=cx.createLinearGradient(0,PY-30,0,PY-260);g.addColorStop(0,'rgba(255,245,180,.4)');g.addColorStop(1,'rgba(255,245,180,0)');cx.fillStyle=g;cx.beginPath();cx.moveTo(px-14,PY-34);cx.lineTo(px-60,PY-260);cx.lineTo(px+60,PY-260);cx.lineTo(px+14,PY-34);cx.fill()}
    if(!(st==='play'&&inv>0&&Math.floor(clock*14)%2)){
      car(px,PY,40,72,CARS[color],cl((lx(lane)-px)*.006,-.25,.25),night);
      if(shield>0){cx.strokeStyle='rgba(120,200,255,.9)';cx.lineWidth=3;cx.fillStyle='rgba(120,200,255,.18)';cx.beginPath();cx.arc(px,PY,48,0,7);cx.fill();cx.stroke()}
    }
    if(st==='play'&&speed>420){cx.strokeStyle='rgba(255,255,255,.25)';cx.lineWidth=2;for(let i=0;i<5;i++){const x=RX+((i*61+clock*400)%(LW*LN));cx.beginPath();cx.moveTo(x,((clock*900+i*130)%H));cx.lineTo(x,((clock*900+i*130)%H)+40);cx.stroke()}}
  }
  for(const p of parts){cx.globalAlpha=cl(p.l*2,0,1);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)}
  cx.globalAlpha=1;cx.restore();
  for(const p of pops){cx.globalAlpha=cl(p.l*2,0,1);tx(p.t,p.x,p.y,18,p.c);cx.globalAlpha=1}
  if(st==='play'||st==='crashing'){
    rr(8,6,W-16,44,12,'rgba(10,12,40,.78)');
    tx(String(score()),W/2,38,32,'#ffd23f');
    cx.fillStyle='#fff';cx.font='700 12px system-ui,sans-serif';cx.textAlign='left';cx.fillText(Math.floor(dist)+' m',20,26);cx.fillText('🪙 '+nCoin,20,42);
    cx.textAlign='right';cx.fillText(Math.round(speed*.35)+' km/j',W-20,26);cx.fillText(shield?'🛡️ aktif':'Rekor '+best,W-20,42);
    if(rdy>0)tx('SIAP!',W/2,260,56,'#fff');
    if(thT>0){cx.globalAlpha=cl(thT,0,1);tx('~ '+TH[th].n+' ~',W/2,120,34,'#7cf');cx.globalAlpha=1}
  }
}
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script>
