<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bertahan dari Zombie</title>
<style>
:root{color-scheme:dark;--bg:#0d0f1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:10px}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(10,12,28,.86);overflow-y:auto}
#ov.h{display:none}
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#ov h1{font:900 44px/1.05 Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;margin:0 0 8px;background:linear-gradient(90deg,#9bff6a,#ffd23f,#ff5a36);-webkit-background-clip:text;background-clip:text;color:transparent}
#ov p{margin:0 0 14px;max-width:330px;line-height:1.45;font-size:15px;color:#d8dcff}
#ov .em{font-size:60px;line-height:1;margin-bottom:6px}
#ov button{font:800 18px system-ui,sans-serif;padding:14px 22px;border:0;border-radius:14px;background:linear-gradient(135deg,#6ccf4a,#ffd23f);color:#12240a;width:100%;max-width:320px;margin-bottom:10px;box-shadow:0 5px 0 #3b7a24}
#ov button:active{transform:translateY(3px);box-shadow:0 2px 0 #3b7a24}
#ov button.s2{background:#262b52;color:#fff;box-shadow:0 5px 0 #121530}
.lg{display:flex;gap:12px;justify-content:center;margin:0 0 14px;font-size:12px;color:#d8dcff}
.lg span{display:flex;flex-direction:column;align-items:center;gap:2px;max-width:76px}.lg b{font-size:24px}
</style>
</head>

/* ---------- SFX ---------- */
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty,v,t0,f2){const a=ac();if(!a)return;const t=a.currentTime+(t0||0),o=a.createOscillator(),q=a.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);q.gain.setValueAtTime(.0001,t);q.gain.exponentialRampToValueAtTime(v||.2,t+.01);q.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(q);q.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,t0,fl){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),q=a.createGain(),t=a.currentTime+(t0||0);s.buffer=b;f.type='bandpass';f.frequency.value=fl||1200;q.gain.setValueAtTime(.0001,t);q.gain.exponentialRampToValueAtTime(v,t+Math.min(.15,d/3));q.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(q);q.connect(a.destination);s.start(t)}
function sfx(k){
  if(mute)return;
  if(k==='click')tone(660,.06,'square',.05);
  else if(k==='shot'){tone(900,.09,'square',.07,0,200);noise(.06,.1,0,3000)}
  else if(k==='hit'){tone(150,.12,'square',.13,0,60);noise(.08,.12,0,900)}
  else if(k==='die'){tone(200,.3,'sawtooth',.14,0,50);noise(.25,.16,0,500)}
  else if(k==='groan'){tone(110,.5,'sawtooth',.06,0,70)}
  else if(k==='wall'){tone(90,.3,'square',.2,0,40);noise(.25,.25,0,400)}
  else if(k==='bomb'){tone(120,.9,'sawtooth',.25,0,30);noise(.9,.4,0,300)}
  else if(k==='boss'){tone(70,1.1,'sawtooth',.2,0,40);tone(95,1.0,'square',.08,.1,50)}
  else if(k==='combo')tone(600+Math.min(combo,10)*60,.09,'triangle',.08);
  else if(k==='lvl')[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.11));
  else if(k==='over')[400,330,262,196].forEach((f,i)=>tone(f,.4,'sawtooth',.13,i*.3));
}

function start(){level=1;score=0;hp=MAXHP;combo=0;maxCombo=0;totalKills=0;charge=0;parts=[];pops=[];shots=[];flash=0;shake=0;newLevel()}
function newLevel(){
  zs=[];kills=0;spawned=0;spawnT=1;need=Math.min(44,6+level*3);if(level%5===0)need=Math.min(need,16);
  st='play';banner=2;bannerT=level%5===0?'LEVEL '+level+' - BOS!':'LEVEL '+level;

}

/* ---------- Logika ---------- */
function spawn(kind){
  let t=kind;
  if(!t){const r=Math.random();t=level>=3&&r<.18?'t':level>=2&&r<.45?'r':'n'}
  const ty=TY[t],bossHp=20+level*2;
  zs.push({t,lane:t==='b'?0:Math.floor(rnd(-2,3)),p:0,hp:t==='b'?bossHp:ty.hp,max:t==='b'?bossHp:ty.hp,sh:SHIRT[Math.random()*6|0],ph:rnd(0,6),hit:0,k:ty.k,pts:ty.pts,skin:ty.skin,T:ty.T});
  spawned++;
}
function zpos(z){const q=Math.pow(z.p,1.4),sc=.2+.8*q;return{x:180+z.lane*(12+62*q),y:HZ+24+(508-HZ-24)*q,sc:sc*z.k}}
function shoot(x,y){
  if(st!=='play'||cool>0)return;cool=.14;aimX=x;recoil=.12;sfx('shot');
  let bi=-1,bp=-1;
  zs.forEach((z,i)=>{const q=zpos(z),dx=q.x-x,dy=(q.y-52*q.sc)-y,R=Math.max(26,40*q.sc+12);if(dx*dx+dy*dy<R*R&&z.p>bp){bp=z.p;bi=i}});
  shots.push({x,y:bi>=0?(zpos(zs[bi]).y-52*zpos(zs[bi]).sc):y,l:.1,hit:bi>=0});
  if(bi<0){if(combo>0)combo=Math.max(0,combo-1);return}
  const z=zs[bi];z.hp--;z.hit=.15;z.p=Math.max(0,z.p-.012);const q=zpos(z);sfx('hit');
  for(let i=0;i<6;i++)parts.push({x:q.x,y:q.y-50*q.sc,vx:rnd(-120,120),vy:rnd(-160,20),l:.5,c:'#8fe36a',s:3});
  if(z.hp<=0)kill(z,bi)
}
function kill(z,i){
  const q=zpos(z);zs.splice(i,1);kills++;totalKills++;charge=Math.min(12,charge+1);
  combo=(clock-lastKill<1.3)?combo+1:1;lastKill=clock;maxCombo=Math.max(maxCombo,combo);
  const mult=Math.min(5,1+Math.floor((combo-1)/3)),pts=z.pts*mult;score+=pts;sfx('die');if(combo>1&&combo%3===1)sfx('combo');
  pops.push({t:'+'+pts,x:q.x,y:q.y-90*q.sc,l:.9,c:z.t==='b'?'#ffd23f':'#fff',s:z.t==='b'?34:22});
  if(mult>1&&combo%3===1)pops.push({t:'KOMBO x'+mult+'!',x:W/2,y:150,l:.9,c:'#ff9a3c',s:30});
  for(let i=0;i<(z.t==='b'?40:16);i++)parts.push({x:q.x,y:q.y-50*q.sc,vx:rnd(-200,200),vy:rnd(-260,-20),l:rnd(.5,1),c:['#8fe36a','#5faa4a','#c0392b'][i%3],s:rnd(3,6)});
  if(z.t==='b'){flash=.4;flashC='#fff';shake=10}
}
function bomb(){
  if(st!=='play'||charge<12)return;charge=0;sfx('bomb');flash=.5;flashC='#ffb347';shake=14;
  for(let i=zs.length-1;i>=0;i--){const z=zs[i];z.hp-=z.t==='b'?6:4;z.hit=.3;if(z.hp<=0)kill(z,i)}
}

});
function update(dt){
  clock+=dt;cool=Math.max(0,cool-dt);recoil=Math.max(0,recoil-dt);shake=Math.max(0,shake-30*dt);flash=Math.max(0,flash-dt);bhit=Math.max(0,bhit-dt);
  if(st==='play'){
    banner=Math.max(0,banner-dt);
    spawnT-=dt;const bossAlive=zs.some(z=>z.t==='b');
    if(spawnT<=0&&spawned<need&&zs.length<14){spawn();spawnT=Math.max(.42,1.6-level*.07)*rnd(.7,1.3)}
    const spd=1/Math.max(4.2,11-level*.5);
    for(let i=zs.length-1;i>=0;i--){const z=zs[i];z.hit=Math.max(0,z.hit-dt);z.p+=dt*spd/z.T;if(Math.random()<dt*.15&&z.p>.2)sfx('groan');
      if(z.p>=1){zs.splice(i,1);const d=z.t==='b'?3:1;hp-=d;sfx('wall');shake=10;flash=.3;flashC='#ff2a2a';bhit=.4;combo=0;pops.push({t:'-'+d+' ❤',x:180,y:470,l:1,c:'#ff6a6a',s:30});
        if(hp<=0){hp=0;over();return}}}
    if(kills>=need&&zs.length===0&&spawned>=need){const bonus=100*level+hp*20;score+=bonus;st='lvl';lvlT=2.4;sfx('lvl');bannerT='LEVEL '+level+' SELESAI!';pops.push({t:'BONUS +'+bonus,x:180,y:330,l:2,c:'#ffd23f',s:30})}
  }else if(st==='lvl'){lvlT-=dt;if(lvlT<=0){level++;newLevel()}}
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
  for(const p of pops){p.y-=34*dt;p.l-=dt}pops=pops.filter(p=>p.l>0);
  for(const s of shots)s.l-=dt;shots=shots.filter(s=>s.l>0);
}
function over(){
  st='over';sfx('over');const nr=score>best;if(nr){best=score;try{localStorage.setItem('zombiebest',best)}catch(e){}}
  setTimeout(()=>show('💀','BARIKADE JEBOL','Kamu bertahan sampai <b>level '+level+'</b><br>Skor: <b>'+score+'</b> · Zombie dikalahkan: '+totalKills+'<br>Kombo terbaik: '+maxCombo+(nr?'<br>🏆 Rekor baru!':'<br>Rekor: '+best),[['Bertahan lagi',start],['Menu',menu,'s2']]),700);
}

/* ---------- Gambar ---------- */
function rr(x,y,w,h,r,f){cx.beginPath();cx.roundRect(x,y,w,h,r);cx.fillStyle=f;cx.fill()}
function tx(s,x,y,sz,col,al){cx.font='900 '+sz+'px '+FONT;cx.textAlign=al||'center';cx.lineJoin='round';cx.lineWidth=sz/6;cx.strokeStyle='#10122a';cx.strokeText(s,x,y);cx.fillStyle=col;cx.fillText(s,x,y)}
function bg(){
  const g=cx.createLinearGradient(0,0,0,HZ+30);g.addColorStop(0,'#150b3a');g.addColorStop(.6,'#7a2a6b');g.addColorStop(1,'#ff7a5a');cx.fillStyle=g;cx.fillRect(0,0,W,HZ+30);
  cx.fillStyle='#fff6c8';cx.beginPath();cx.arc(270,70,28,0,7);cx.fill();cx.fillStyle='rgba(21,11,58,.18)';cx.beginPath();cx.arc(262,64,24,0,7);cx.fill();
  cx.fillStyle='#fff';for(let i=0;i<20;i++)cx.fillRect((i*67)%W,(i*41)%110,1.6,1.6);
  const b=[[0,70,90],[50,50,60],[100,86,110],[160,60,70],[215,96,100],[275,56,80],[320,80,95]];
  cx.fillStyle='#1b1030';for(const [x,w,h] of b)cx.fillRect(x,HZ+22-h,w,h);
  cx.fillStyle='rgba(255,210,90,.7)';for(const [x,w,h] of b)for(let r=0;r<h/22;r++)for(let c=0;c<w/20;c++)if(((x+r*7+c*13)%5)===0)cx.fillRect(x+8+c*18,HZ+22-h+8+r*20,6,8);
  const rd=cx.createLinearGradient(0,HZ+20,0,H);rd.addColorStop(0,'#3a3550');rd.addColorStop(1,'#242238');cx.fillStyle='#1f2a24';cx.fillRect(0,HZ+22,W,H-HZ);
  cx.fillStyle=rd;cx.beginPath();cx.moveTo(150,HZ+22);cx.lineTo(210,HZ+22);cx.lineTo(W+40,H);cx.lineTo(-40,H);cx.fill();
  cx.strokeStyle='rgba(255,255,255,.35)';cx.lineWidth=3;cx.setLineDash([16,14]);cx.lineDashOffset=-clock*60;
  for(const l of[-1,1]){cx.beginPath();cx.moveTo(180+l*8,HZ+22);cx.lineTo(180+l*130,H);cx.stroke()}cx.setLineDash([]);
  cx.fillStyle='rgba(160,190,200,.14)';cx.fillRect(0,HZ+10,W,50);
  for(const l of[-1,1]){for(let i=0;i<4;i++){const q=Math.pow((i+.5)/4,1.4),x=180+l*(150+q*150),y=HZ+22+(500-HZ)*q,s=.3+q;cx.fillStyle='#4a4660';cx.fillRect(x-3*s,y-60*s,6*s,60*s);cx.fillStyle='rgba(255,230,140,'+(.5+.3*Math.sin(clock*3+i))+')';cx.beginPath();cx.arc(x,y-62*s,7*s,0,7);cx.fill()}}
}
function zombie(z){
  const q=zpos(z),s=q.sc,t=clock*5+z.ph;
  if(q.y<HZ+22)return;
  cx.save();cx.translate(q.x,q.y);cx.scale(s,s);
  cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(0,2,34,9,0,0,7);cx.fill();
  const sw=Math.sin(t)*5,bob=Math.abs(Math.sin(t))*4;cx.translate(0,-bob);
  cx.fillStyle='#3b3f5c';cx.fillRect(-18,-36+sw,15,36-sw);cx.fillRect(3,-36-sw,15,36+sw);
  cx.fillStyle='#22243a';cx.fillRect(-20,-6+sw,19,7);cx.fillRect(2,-6-sw,19,7);
  rr(-26,-84,52,52,10,z.sh);cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.moveTo(-26,-40);for(let i=0;i<6;i++)cx.lineTo(-26+i*10.4+5,-34+(i%2)*8);cx.lineTo(26,-40);cx.fill();
  cx.strokeStyle=z.skin;cx.lineWidth=11;cx.lineCap='round';const ar=Math.sin(t*.8)*4;
  cx.beginPath();cx.moveTo(-24,-74);cx.lineTo(-38,-96+ar);cx.moveTo(24,-74);cx.lineTo(38,-96-ar);cx.stroke();
  cx.fillStyle=z.skin;cx.beginPath();cx.arc(-38,-98+ar,8,0,7);cx.arc(38,-98-ar,8,0,7);cx.fill();
  cx.fillStyle=z.skin;cx.beginPath();cx.arc(0,-104,24,0,7);cx.fill();cx.strokeStyle='rgba(0,0,0,.35)';cx.lineWidth=2.5;cx.stroke();
  cx.fillStyle='#2e2a24';cx.beginPath();cx.arc(-6,-120,16,Math.PI,0);cx.fill();
  cx.fillStyle='#fff';cx.beginPath();cx.arc(-9,-107,6.5,0,7);cx.arc(9,-107,6.5,0,7);cx.fill();
  cx.fillStyle=z.t==='b'?'#ffe600':'#d11a1a';cx.beginPath();cx.arc(-8,-106,3,0,7);cx.arc(10,-106,3,0,7);cx.fill();
  cx.fillStyle='#3a0a10';cx.beginPath();cx.ellipse(0,-94,10,6+Math.abs(Math.sin(t*.7))*3,0,0,7);cx.fill();cx.fillStyle='#fff';cx.fillRect(-6,-98,4,3);cx.fillRect(2,-98,4,3);
  if(z.t==='t'){cx.fillStyle='rgba(255,255,255,.25)';cx.fillRect(-26,-70,52,6)}
  if(z.t==='b'){cx.fillStyle='#ffd23f';cx.beginPath();cx.moveTo(-18,-122);cx.lineTo(-18,-140);cx.lineTo(-8,-130);cx.lineTo(0,-144);cx.lineTo(8,-130);cx.lineTo(18,-140);cx.lineTo(18,-122);cx.fill()}
  if(z.hit>0){cx.fillStyle='rgba(255,255,255,.5)';cx.beginPath();cx.arc(0,-70,50,0,7);cx.fill()}
  cx.restore();
  if(z.max>1){const w=50*s*1.1;rr(q.x-w/2,q.y-135*s-4,w,6,3,'rgba(0,0,0,.6)');rr(q.x-w/2,q.y-135*s-4,w*cl(z.hp/z.max,0,1),6,3,z.t==='b'?'#ff5a36':'#8fe36a')}
}
function barricade(){
  const dmg=1-hp/MAXHP;cx.save();if(bhit>0)cx.translate(rnd(-3,3),0);
  for(let i=0;i<6;i++){const x=-10+i*62;rr(x,512-(i%2)*6,64,34,4,'#8b5a2b');cx.fillStyle='rgba(0,0,0,.25)';cx.fillRect(x,512-(i%2)*6+14,64,3);cx.fillStyle='#c9ccd6';cx.beginPath();cx.arc(x+8,524,2.2,0,7);cx.arc(x+56,524,2.2,0,7);cx.fill()}
  rr(-10,540,W+20,70,0,'#6b4220');for(let i=0;i<7;i++)cx.fillRect(i*58,540,3,60);
  cx.strokeStyle='#d8dcee';cx.lineWidth=3;for(let i=0;i<5;i++){cx.beginPath();cx.moveTo(i*80-4,506);cx.lineTo(i*80+16,498);cx.lineTo(i*80+36,508);cx.stroke()}
  if(dmg>.2){cx.strokeStyle='rgba(20,10,5,.6)';cx.lineWidth=3;for(let i=0;i<Math.floor(dmg*8);i++){cx.beginPath();cx.moveTo(30+i*40,514);cx.lineTo(44+i*40,530);cx.lineTo(34+i*40,544);cx.stroke()}}
  cx.restore();
}
function kuyo(){
  if(!KUYO.complete||!KUYO.naturalWidth)return;
  const h=150,w=KUYO.naturalWidth*h/KUYO.naturalHeight,flip=aimX<180,bob=Math.sin(clock*3)*2-(recoil>0?5:0);
  cx.save();cx.translate(180,566+bob);if(flip)cx.scale(-1,1);cx.drawImage(KUYO,-w/2,-h,w,h);cx.restore();
}
function hud(){
  rr(8,8,W-16,50,14,'rgba(10,12,40,.8)');
  cx.font='700 12px system-ui,sans-serif';cx.fillStyle='#d8dcff';cx.textAlign='left';cx.fillText('LEVEL',20,26);cx.textAlign='right';cx.fillText('REKOR '+best,W-20,26);
  tx(String(level),42,50,26,'#9bff6a','center');tx(String(score),W/2,46,34,'#ffd23f');
  cx.font='15px system-ui,sans-serif';cx.textAlign='right';cx.fillText('❤️'.repeat(hp)+'🖤'.repeat(MAXHP-hp),W-16,50);
  rr(10,62,W-20,7,4,'rgba(0,0,0,.4)');rr(10,62,(W-20)*cl(kills/Math.max(1,need),0,1),7,4,'#9bff6a');
  const rdy=charge>=12;cx.beginPath();cx.arc(318,552,30,0,7);cx.fillStyle=rdy?'#ff7a1a':'rgba(10,12,40,.75)';cx.fill();cx.strokeStyle=rdy?'#ffd23f':'#4a56a0';cx.lineWidth=3;cx.stroke();
  cx.fillStyle='#fff';cx.font='22px system-ui,sans-serif';cx.textAlign='center';cx.fillText('💣',318,560);
  if(!rdy){cx.strokeStyle='#9bff6a';cx.lineWidth=4;cx.beginPath();cx.arc(318,552,26,-Math.PI/2,-Math.PI/2+Math.PI*2*charge/12);cx.stroke()}
  if(combo>=3&&clock-lastKill<1.3)tx('KOMBO x'+Math.min(5,1+Math.floor((combo-1)/3)),W/2,100,24,'#ff9a3c');
}
function render(){
  cx.setTransform(2,0,0,2,0,0);cx.save();if(shake>0)cx.translate(rnd(-shake,shake),rnd(-shake,shake));
  bg();zs.slice().sort((a,b)=>a.p-b.p).forEach(zombie);kuyo();
  for(const s of shots){cx.strokeStyle='rgba(255,240,150,'+s.l*8+')';cx.lineWidth=3;cx.beginPath();cx.moveTo(180+(aimX<180?-26:26),470);cx.lineTo(s.x,s.y);cx.stroke();if(s.hit){cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,8*(1-s.l*5),0,7);cx.fill()}}
  barricade();
  for(const p of parts){cx.globalAlpha=cl(p.l*2,0,1);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)}cx.globalAlpha=1;cx.restore();
  const v=cx.createRadialGradient(180,300,160,180,300,420);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(5,3,20,.55)');cx.fillStyle=v;cx.fillRect(0,0,W,H);
  if(flash>0){cx.globalAlpha=flash;cx.fillStyle=flashC;cx.fillRect(0,0,W,H);cx.globalAlpha=1}
  for(const p of pops){cx.globalAlpha=cl(p.l*2,0,1);tx(p.t,p.x,p.y,p.s,p.c);cx.globalAlpha=1}
  if(st==='play'||st==='lvl')hud();
  if(banner>0&&st==='play'){cx.globalAlpha=cl(banner,0,1);tx(bannerT,W/2,300,44,level%5===0?'#ff5a36':'#fff');cx.globalAlpha=1}
  if(st==='lvl')tx(bannerT,W/2,270,38,'#9bff6a');
}
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script>
