<title>Sapu Terbang</title>
<style>
:root{color-scheme:dark;--bg:#120c2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:10px}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(18,12,46,.84);overflow-y:auto}
#ov.h{display:none}
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#ov h1{font:900 46px/1.05 Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;margin:0 0 8px;background:linear-gradient(90deg,#ffd23f,#ff6ec7,#7cf4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#ov p{margin:0 0 14px;max-width:330px;line-height:1.45;font-size:15px;color:#e6dcff}
#ov img{height:120px;margin-bottom:6px;image-rendering:auto}
#ov button{font:800 18px system-ui,sans-serif;padding:14px 22px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff6ec7,#ffd23f);color:#2a0f2e;width:100%;max-width:320px;margin-bottom:10px;box-shadow:0 5px 0 #a8337c}
#ov button:active{transform:translateY(3px);box-shadow:0 2px 0 #a8337c}
#ov button.s2{background:#2b2358;color:#fff;box-shadow:0 5px 0 #130f30}
.lg{display:flex;gap:12px;justify-content:center;margin:0 0 14px;font-size:12px;color:#e6dcff}
.lg span{display:flex;flex-direction:column;align-items:center;gap:2px;max-width:78px}.lg b{font-size:24px}
</style>

  else if(k==='shield'){tone(400,.3,'sine',.14,0,1200)}
  else if(k==='block'){noise(.25,.2,0,1500);tone(300,.2,'square',.1,0,120)}
  else if(k==='hit'){noise(.35,.25,0,700);tone(180,.4,'sawtooth',.15,0,50)}
  else if(k==='caw'){tone(520,.12,'sawtooth',.08,0,380);tone(480,.14,'sawtooth',.07,.14,330)}
  else if(k==='warn')tone(900,.08,'square',.05);
  else if(k==='thunder'){noise(.6,.4,0,300);tone(90,.5,'sawtooth',.2,0,40)}
  else if(k==='lvl')[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.13,i*.09));
  else if(k==='over')[400,330,262,196].forEach((f,i)=>tone(f,.4,'sawtooth',.13,i*.28));
}
document.addEventListener('pointerdown',e=>{ac();if(e.target.closest&&e.target.closest('#ov button'))sfx('click')});
const mb=document.createElement('button');
mb.setAttribute('style','position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;background:rgba(18,12,46,.85);color:#fff;border:1px solid #5a4aa0;border-radius:20px;padding:6px 12px;font-size:18px');
mb.setAttribute('aria-label','Suara');mb.textContent=mute?'🔇':'🔊';
mb.onclick=()=>{mute=!mute;mb.textContent=mute?'🔇':'🔊';try{localStorage.setItem('sapumute',mute?'1':'0')}catch(e){}};
document.body.appendChild(mb);

/* ---------- Layar ---------- */
function fit(){const s=$('stage'),k=Math.min(s.clientWidth/W,s.clientHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px'}
addEventListener('resize',fit);fit();
function show(h,p,btns,extra,img){
  ov.innerHTML=(img?'<img src="'+img+'" alt="">':'')+'<h1>'+h+'</h1><p>'+p+'</p>'+(extra||'');
  btns.forEach(([t,fn,c])=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=()=>{ov.classList.add('h');fn()};ov.appendChild(b)});
  ov.classList.remove('h');
}
function menu(){
  st='menu';reset();
  show('SAPU TERBANG','Tahan layar agar Kuyo terbang naik, lepas untuk turun. Lewati rintangan dan kumpulkan bintang! Rekor: '+best+'.',[['Terbang!',start]],
   '<div class=lg><span><b>⭐</b>bintang +10</span><span><b>🧪</b>ramuan magnet</span><span><b>🛡️</b>perisai</span><span><b>🐦</b>awas gagak dan petir!</span></div>',SPR.fly.src);
}
function reset(){ky=300;vy=0;dist=0;score=0;stars=0;lives=3;inv=0;shield=0;magnet=0;level=1;obs=[];items=[];parts=[];pops=[];trail=[];spawnX=W+80;banner=0;hurt=0;tilt=0;shake=0;flash=0;over=0}
function start(){reset();st='play';banner=1.6;bannerT='LEVEL 1';sfx('go')}
function finish(){
  st='over';const sc=score,nr=sc>best;if(nr){best=sc;try{localStorage.setItem('sapubest',best)}catch(e){}}
  show('JATUH!','Skor: <b>'+sc+'</b><br>Jarak: '+Math.floor(dist/10)+' m · Bintang: '+stars+'<br>'+(nr?'🏆 Rekor baru!':'Rekor: '+best),[['Terbang lagi',start],['Menu',menu,'s2']],'',null);
}

/* ---------- Input ---------- */
cv.addEventListener('pointerdown',e=>{e.preventDefault();hold=1});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{hold=0}));
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){hold=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.key===' '||e.key==='ArrowUp'||e.key==='w')hold=0});

/* ---------- Logika ---------- */
const speed=()=>Math.min(330,150+level*18);
function spawnPattern(){
  const r=Math.random(),gap=Math.max(128,200-level*8);
  if(r<.5||level<2&&r<.75){
    const gy=rnd(CEIL+gap/2+30,FLOOR-gap/2-30);obs.push({t:'p',x:spawnX,gy,gap,w:56,hp:0});spawnX+=rnd(200,260);
    if(Math.random()<.7)for(let i=0;i<4;i++)items.push({t:'s',x:spawnX-130+i*22,y:gy+Math.sin(i)*14,g:0});
  }else if(r<.68){
    const y=rnd(140,440);for(let i=0;i<6;i++)items.push({t:'s',x:spawnX+i*28,y:y+Math.sin(i*.9)*34,g:0});spawnX+=210;
  }else if(r<.84&&level>=2){obs.push({t:'c',x:spawnX,y:rnd(130,440),ph:rnd(0,6),b:0,call:0});spawnX+=170;}
  else if(r<.93&&level>=3){obs.push({t:'k',x:spawnX,age:0,warn:0,hp:0});spawnX+=230;}
  else if(r<.97){items.push({t:'z',x:spawnX,y:rnd(150,430),g:0});spawnX+=150}
  else{items.push({t:'h',x:spawnX,y:rnd(150,430),g:0});spawnX+=150}
}
function hurtK(){
  if(inv>0)return;
  if(shield){shield=0;inv=1.0;sfx('block');for(let i=0;i<16;i++)parts.push({x:KX,y:ky,vx:rnd(-220,220),vy:rnd(-220,220),l:.5,c:'#7cf4ff',s:4});return}
  lives--;inv=1.6;hurt=.5;sfx('hit');shake=10;flash=.25;flashC='#ff3355';vy=-260;
  for(let i=0;i<18;i++)parts.push({x:KX,y:ky,vx:rnd(-240,240),vy:rnd(-260,60),l:rnd(.4,.9),c:['#ff3355','#ffd23f','#fff'][i%3],s:rnd(3,6)});
  if(lives<=0){st='dying';over=.9;sfx('over')}
}
function update(dt){
  clock+=dt;shake=Math.max(0,shake-30*dt);flash=Math.max(0,flash-dt);inv=Math.max(0,inv-dt);hurt=Math.max(0,hurt-dt);banner=Math.max(0,banner-dt);bgx+=dt*(st==='play'?speed():40);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
  for(const p of pops){p.y-=34*dt;p.l-=dt}pops=pops.filter(p=>p.l>0);
  if(st==='dying'){vy+=900*dt;ky+=vy*dt;tilt+=dt*6;over-=dt;if(over<=0)finish();return}
  if(st!=='play')return;
  const sp=speed();dist+=sp*dt;score=Math.floor(dist/10)+stars*10+(score>0?0:0);
  const lv=1+Math.floor(dist/1500);if(lv>level){level=lv;banner=1.8;bannerT='LEVEL '+level;sfx('lvl')}
  vy+=(hold?-1500:950)*dt;vy=cl(vy,-340,400);ky+=vy*dt;tilt=lerp(tilt,cl(vy/700,-.32,.32),Math.min(1,dt*8));
  if(ky<CEIL){ky=CEIL;vy=Math.max(vy,0)}
  if(ky>FLOOR-26){ky=FLOOR-26;hurtK();vy=-300}
  if(Math.random()<dt*40&&hold)trail.push({x:KX-34,y:ky+22,l:.5,v:rnd(-30,30)});
  for(const t of trail){t.x-=sp*dt;t.y+=t.v*dt;t.l-=dt}trail=trail.filter(t=>t.l>0);
  spawnX-=sp*dt;while(spawnX<W+120)spawnPattern();
  if(magnet>0)magnet-=dt;
  for(const o of obs){
    o.x-=sp*dt;
    if(o.t==='p'){if(inv<=0&&KX+20>o.x-o.w/2&&KX-20<o.x+o.w/2&&(ky-24<o.gy-o.gap/2||ky+24>o.gy+o.gap/2))hurtK()}
    else if(o.t==='c'){o.x-=sp*.35*dt;o.ph+=dt*3;o.b=Math.sin(o.ph)*46;if(!o.call&&o.x<W+10){o.call=1;sfx('caw')}if(inv<=0&&Math.hypot(o.x-KX,o.y+o.b-ky)<30)hurtK()}
    else if(o.t==='k'){o.age+=dt;if(o.age>1.0&&o.age<1.5&&!o.warn){o.warn=1;sfx('warn')}if(o.age>1.5&&o.hp===0){o.hp=1;sfx('thunder');shake=6}
      if(o.hp===1&&o.age<1.9&&inv<=0&&Math.abs(KX-o.x)<24&&ky>110)hurtK()}
  }
  obs=obs.filter(o=>o.x>-90);
  for(const it of items){
    it.x-=sp*dt;
    if(magnet>0&&(it.t==='s'||it.t==='z')){const dx=KX-it.x,dy=ky-it.y,d=Math.hypot(dx,dy);if(d<140){it.x+=dx/d*260*dt;it.y+=dy/d*260*dt}}
    if(!it.got&&Math.hypot(it.x-KX,it.y-ky)<30){it.got=1;
      if(it.t==='s'){stars++;sfx('star');pops.push({t:'+10',x:it.x,y:it.y,l:.7,c:'#ffd23f',s:20})}
      else if(it.t==='z'){magnet=6;sfx('potion');score+=0;pops.push({t:'MAGNET!',x:KX+30,y:ky-40,l:1,c:'#7cf4ff',s:24})}
      else{shield=1;sfx('shield');pops.push({t:'PERISAI!',x:KX+30,y:ky-40,l:1,c:'#7cf4ff',s:24})}}
  }
  items=items.filter(i=>i.x>-40&&!i.got);
}

/* ---------- Gambar ---------- */
function rr(x,y,w,h,r,f){cx.beginPath();cx.roundRect(x,y,w,h,r);cx.fillStyle=f;cx.fill()}
function tx(s,x,y,sz,col,al){cx.font='900 '+sz+'px '+FONT;cx.textAlign=al||'center';cx.lineJoin='round';cx.lineWidth=sz/6;cx.strokeStyle='#150d38';cx.strokeText(s,x,y);cx.fillStyle=col;cx.fillText(s,x,y)}
function bg(){
  const T=TH[(level-1)%3],g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,T.a);g.addColorStop(1,T.b);cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.fillStyle=T.sun;cx.beginPath();cx.arc(280,110,30,0,7);cx.fill();
  if(level%3!==0){cx.fillStyle='#fff';for(let i=0;i<24;i++)cx.fillRect((i*71)%W,(i*47)%300,1.6,1.6)}
  cx.fillStyle='rgba(255,255,255,.16)';for(let i=0;i<6;i++){const x=((i*170-bgx*.15)%(W+200)+W+200)%(W+200)-100,y=60+i*70;cx.beginPath();cx.ellipse(x,y,50,16,0,0,7);cx.ellipse(x+26,y-8,34,14,0,0,7);cx.fill()}
  cx.fillStyle=T.m2;for(let i=-1;i<5;i++){const x=((i*140-bgx*.3)%700+700)%700-140;cx.beginPath();cx.moveTo(x,FLOOR);cx.lineTo(x+50,FLOOR-110);cx.lineTo(x+100,FLOOR);cx.fill()}
  cx.fillStyle=T.m;for(let i=-1;i<9;i++){const x=((i*84-bgx*.5)%756+756)%756-84,h=50+((i*37)%5)*16;cx.fillRect(x,FLOOR-h,60,h);cx.beginPath();cx.moveTo(x-4,FLOOR-h);cx.lineTo(x+30,FLOOR-h-26);cx.lineTo(x+64,FLOOR-h);cx.fill();cx.fillStyle='rgba(255,214,120,.85)';cx.fillRect(x+10,FLOOR-h+14,8,10);cx.fillRect(x+38,FLOOR-h+26,8,10);cx.fillStyle=T.m}
  cx.fillStyle='#120c28';cx.fillRect(0,FLOOR,W,H-FLOOR);cx.fillStyle='#1f1745';for(let i=-1;i<12;i++){const x=((i*44-bgx)%528+528)%528-44;cx.fillRect(x,FLOOR+6,32,H)}
}
function drawObs(o){
  if(o.t==='p'){
    const tg=o.gy-o.gap/2,bt=o.gy+o.gap/2,x=o.x-o.w/2;
    rr(x,FLOOR-(FLOOR-bt),o.w,FLOOR-bt,6,'#8a4b3a');cx.fillStyle='rgba(0,0,0,.2)';for(let y=bt+14;y<FLOOR;y+=18)cx.fillRect(x,y,o.w,3);
    cx.fillStyle='#c0392b';cx.beginPath();cx.moveTo(x-8,bt);cx.lineTo(o.x,bt-34);cx.lineTo(x+o.w+8,bt);cx.fill();
    rr(x,0,o.w,tg,6,'#5a4a8a');cx.fillStyle='rgba(0,0,0,.25)';for(let y=14;y<tg;y+=18)cx.fillRect(x,y,o.w,3);
    cx.fillStyle='#8e44ad';cx.beginPath();cx.moveTo(x-8,tg);cx.lineTo(o.x,tg+34);cx.lineTo(x+o.w+8,tg);cx.fill();
  }else if(o.t==='c'){
    const y=o.y+o.b,f=Math.sin(clock*16)*9;cx.save();cx.translate(o.x,y);cx.fillStyle='#16132b';cx.beginPath();cx.moveTo(-4,0);cx.quadraticCurveTo(-22,-14+f,-32,-2+f);cx.quadraticCurveTo(-18,2,-10,10);cx.lineTo(0,5);cx.lineTo(10,10);cx.quadraticCurveTo(18,2,32,-2+f);cx.quadraticCurveTo(22,-14+f,4,0);cx.fill();cx.beginPath();cx.arc(0,2,11,0,7);cx.fill();cx.fillStyle='#ffd23f';cx.beginPath();cx.moveTo(-10,0);cx.lineTo(-20,3);cx.lineTo(-10,5);cx.fill();cx.fillStyle='#ff4d4d';cx.fillRect(-4,-2,3,3);cx.restore()
  }else{
    const warn=o.age>1.0&&o.age<1.5,strike=o.hp===1&&o.age<1.9;
    cx.fillStyle=warn&&Math.floor(clock*14)%2?'#7b6a9a':'#3b3358';for(const [dx,dy,r] of[[-26,0,26],[0,-10,32],[28,0,26],[0,8,28]]){cx.beginPath();cx.arc(o.x+dx,96+dy,r,0,7);cx.fill()}
    if(warn){cx.strokeStyle='rgba(255,90,90,.6)';cx.lineWidth=3;cx.setLineDash([8,8]);cx.beginPath();cx.moveTo(o.x,130);cx.lineTo(o.x,FLOOR);cx.stroke();cx.setLineDash([])}
    if(strike){cx.strokeStyle='#fff7a8';cx.lineWidth=9;cx.beginPath();cx.moveTo(o.x,124);let y=124;while(y<FLOOR){y+=36;cx.lineTo(o.x+(Math.random()-.5)*30,y)}cx.stroke();cx.strokeStyle='#fff';cx.lineWidth=3;cx.stroke()}
  }
}
function broomKuyo(){
  if(st==='menu')return;
  const flick=inv>0&&Math.floor(clock*16)%2&&st!=='dying';if(flick)return;
  cx.save();cx.translate(KX,ky);cx.rotate(tilt);
  for(const t of trail){}
  cx.strokeStyle='#9a6a3a';cx.lineWidth=7;cx.lineCap='round';cx.beginPath();cx.moveTo(-40,26);cx.lineTo(38,20);cx.stroke();
  cx.strokeStyle='#c99a5a';cx.lineWidth=3;cx.beginPath();cx.moveTo(-40,24);cx.lineTo(38,18);cx.stroke();
  cx.fillStyle='#e6c24a';cx.beginPath();cx.moveTo(-36,26);cx.lineTo(-70,14+Math.sin(clock*20)*3);cx.lineTo(-74,26);cx.lineTo(-70,38-Math.sin(clock*20)*3);cx.closePath();cx.fill();
  cx.strokeStyle='#b8902a';cx.lineWidth=2;for(let i=0;i<4;i++){cx.beginPath();cx.moveTo(-38,26);cx.lineTo(-72,16+i*7);cx.stroke()}
  const img=hurt>0||st==='dying'?SPR.hit:(vy<-60?SPR.up:SPR.fly);
  if(img.complete&&img.naturalWidth){const h=88,w=img.naturalWidth*h/img.naturalHeight;cx.drawImage(img,-w/2+4,-h+34,w,h)}
  if(shield){cx.strokeStyle='rgba(124,244,255,.9)';cx.lineWidth=3;cx.fillStyle='rgba(124,244,255,.16)';cx.beginPath();cx.arc(0,-8,50,0,7);cx.fill();cx.stroke()}
  cx.restore();
}
function hud(){
  rr(8,8,W-16,46,14,'rgba(18,12,46,.8)');
  cx.font='700 12px system-ui,sans-serif';cx.fillStyle='#e6dcff';cx.textAlign='left';cx.fillText('⭐ '+stars,20,26);cx.fillText('LV '+level,20,44);
  cx.textAlign='right';cx.fillText('REKOR '+best,W-20,26);
  if(SPR.head.complete&&SPR.head.naturalWidth)for(let i=0;i<3;i++){cx.globalAlpha=i<lives?1:.25;cx.drawImage(SPR.head,W-34-i*24,28,20,22)}cx.globalAlpha=1;
  tx(String(score),W/2,44,32,'#ffd23f');
  if(magnet>0){cx.fillStyle='#7cf4ff';cx.font='700 11px system-ui';cx.textAlign='center';cx.fillText('🧪 magnet '+Math.ceil(magnet)+'s',W/2,66)}
}
function render(){
  cx.setTransform(2,0,0,2,0,0);cx.save();if(shake>0)cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  bg();obs.forEach(drawObs);
  for(const it of items){
    if(it.t==='s'){const sx=Math.abs(Math.cos(clock*4+it.x*.05));cx.fillStyle='#ffd23f';cx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?5:11;cx.lineTo(it.x+Math.cos(a)*r,it.y+Math.sin(a)*r)}cx.closePath();cx.fill();cx.fillStyle='#fff6b0';cx.fillRect(it.x-1.5,it.y-1.5,3,3)}
    else if(it.t==='z'){cx.fillStyle='#7bdc6a';cx.beginPath();cx.arc(it.x,it.y+4,10,0,7);cx.fill();cx.fillStyle='#d8f9d0';cx.fillRect(it.x-3,it.y-12,6,10);cx.fillStyle='rgba(255,255,255,.6)';cx.beginPath();cx.arc(it.x-3,it.y+1,3,0,7);cx.fill()}
    else{cx.fillStyle='rgba(124,244,255,.3)';cx.beginPath();cx.arc(it.x,it.y,15,0,7);cx.fill();cx.strokeStyle='#7cf4ff';cx.lineWidth=3;cx.stroke();cx.font='14px system-ui';cx.textAlign='center';cx.fillStyle='#fff';cx.fillText('🛡️',it.x,it.y+5)}
  }
  for(const t of trail){cx.globalAlpha=cl(t.l*2,0,1);cx.fillStyle=t.l>.25?'#ffd23f':'#ff6ec7';cx.fillRect(t.x,t.y,4,4)}cx.globalAlpha=1;
  broomKuyo();
  for(const p of parts){cx.globalAlpha=cl(p.l*2,0,1);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)}cx.globalAlpha=1;cx.restore();
  if(flash>0){cx.globalAlpha=flash*1.6;cx.fillStyle=flashC;cx.fillRect(0,0,W,H);cx.globalAlpha=1}
  for(const p of pops){cx.globalAlpha=cl(p.l*2,0,1);tx(p.t,p.x,p.y,p.s,p.c);cx.globalAlpha=1}
  if(st==='play'||st==='dying')hud();
  if(banner>0&&st==='play'){cx.globalAlpha=cl(banner,0,1);tx(bannerT,W/2,300,46,'#fff');tx(TH[(level-1)%3].n,W/2,338,22,'#ffd23f');cx.globalAlpha=1}
  if(st==='menu'){ }
}
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script>
